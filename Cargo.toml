[package]
name = "dcc-auth"
version = "1.0.0"
edition = "2021"
description = "Rust/WASM authentication core for Dumper Cricket Club"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
