services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dcc
      POSTGRES_PASSWORD: dcc
      POSTGRES_DB: dcc
    volumes:
      - dcc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcc"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://dcc:dcc@postgres:5432/dcc
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dcc_pg:
